#####################################
# LOOP STATEMENTS
#####################################
loop LOOPREAC KsPipLamb_00 KsPipLamb_45 KsPipLamb_90 KsPipLamb_135

loop LOOPDATA    SIG0    SIG45    SIG90    SIG135
loop LOOPBKGND   BKGND0  BKGND45  BKGND90  BKGND135
loop LOOPBKGNDWT BKGNDWT0 BKGNDWT45 BKGNDWT90 BKGNDWT135
loop LOOPACCMC   ACCMC0  ACCMC45  ACCMC90  ACCMC135
loop LOOPACCMCWT ACCMCWT0 ACCMCWT45 ACCMCWT90 ACCMCWT135
loop LOOPGENMC   GENMC0  GENMC45  GENMC90  GENMC135

loop LOOPPOLANG polAngle_00 polAngle_45 polAngle_90 polAngle_135
loop LOOPPOLVAL polVal_00 polVal_45 polVal_90 polVal_135

loop LOOPSCALE [parScale00_s18fa18] [parScale45_s18fa18] [parScale90_s18fa18] [parScale135_s18fa18]

#####################################
# SETUP INPUT, REACTIONS, SUMS
#####################################

reaction LOOPREAC Beam Lambda KShort Pi+

data   LOOPREAC FSRootDataReader LOOPDATA   ntFSGlueX_100000000_1100 3
bkgnd  LOOPREAC FSRootDataReader LOOPBKGND  ntFSGlueX_100000000_1100 3 LOOPBKGNDWT ntFSGlueX_100000000_1100_weight weight
accmc  LOOPREAC FSRootDataReader LOOPACCMC  ntFSGlueX_100000000_1100 3 LOOPACCMCWT ntFSGlueX_100000000_1100_weight weight
genmc  LOOPREAC FSRootDataReader LOOPGENMC  ntFSGlueX_100000000_1100 3 MC

sum LOOPREAC ReZ_1-P
sum LOOPREAC ImZ_1+P
sum LOOPREAC ReZ_1+P
sum LOOPREAC ImZ_1-P

# normintfile LOOPREAC normFile_TwoPiAngles_allPol.ni

#####################################
# DEFINE AMPLITUDES
#####################################



#####################################
# SINGLE SUM FOR SDMEs
#####################################
# S-Waves: amplitudes
amplitude LOOPREAC::ReZ_1-P::0S+0n Zlm 0 0 +1 -1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::ImZ_1+P::0S+0n Zlm 0 0 -1 +1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::ReZ_1+P::0S+0p Zlm 0 0 +1 +1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::ImZ_1-P::0S+0p Zlm 0 0 -1 -1 LOOPPOLANG LOOPPOLVAL

# S-Waves: constrain reflectivity. n=negative reflectivity; p=positive reflectivity
constrain LOOPREAC::ReZ_1-P::0S+0n LOOPREAC::ImZ_1+P::0S+0n
constrain LOOPREAC::ReZ_1+P::0S+0p LOOPREAC::ImZ_1-P::0S+0p

# S-Waves: constrain datasets
constrain KsPipLamb_00::ReZ_1-P::0S+0n LOOPREAC::ReZ_1-P::0S+0n 
constrain KsPipLamb_00::ImZ_1+P::0S+0n LOOPREAC::ImZ_1+P::0S+0n 
constrain KsPipLamb_00::ReZ_1+P::0S+0p LOOPREAC::ReZ_1+P::0S+0p 
constrain KsPipLamb_00::ImZ_1-P::0S+0p LOOPREAC::ImZ_1-P::0S+0p 

# S-Waves: scale data sets
scale LOOPREAC::ReZ_1-P::0S+0n LOOPSCALE
scale LOOPREAC::ImZ_1+P::0S+0n LOOPSCALE
scale LOOPREAC::ReZ_1+P::0S+0p LOOPSCALE
scale LOOPREAC::ImZ_1-P::0S+0p LOOPSCALE

initialize LOOPREAC::ReZ_1-P::0S+0n cartesian 1.0 0.0
initialize LOOPREAC::ReZ_1+P::0S+0p cartesian 1.0 0.0


# P-Waves: amplitudes
amplitude LOOPREAC::ReZ_1-P::1P+1n Zlm 1 1 +1 -1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::ImZ_1+P::1P+1n Zlm 1 1 -1 +1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::ReZ_1+P::1P+1p Zlm 1 1 +1 +1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::ImZ_1-P::1P+1p Zlm 1 1 -1 -1 LOOPPOLANG LOOPPOLVAL

amplitude LOOPREAC::ReZ_1-P::1P+0n Zlm 1 0 +1 -1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::ImZ_1+P::1P+0n Zlm 1 0 -1 +1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::ReZ_1+P::1P+0p Zlm 1 0 +1 +1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::ImZ_1-P::1P+0p Zlm 1 0 -1 -1 LOOPPOLANG LOOPPOLVAL

amplitude LOOPREAC::ReZ_1-P::1P-1n Zlm 1 -1 +1 -1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::ImZ_1+P::1P-1n Zlm 1 -1 -1 +1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::ReZ_1+P::1P-1p Zlm 1 -1 +1 +1 LOOPPOLANG LOOPPOLVAL
amplitude LOOPREAC::ImZ_1-P::1P-1p Zlm 1 -1 -1 -1 LOOPPOLANG LOOPPOLVAL


# P-Waves: constrain reflectivity. n=negative reflectivity; p=positive reflectivity
constrain LOOPREAC::ReZ_1-P::1P+1n LOOPREAC::ImZ_1+P::1P+1n
constrain LOOPREAC::ReZ_1+P::1P+1p LOOPREAC::ImZ_1-P::1P+1p

constrain LOOPREAC::ReZ_1-P::1P+0n LOOPREAC::ImZ_1+P::1P+0n
constrain LOOPREAC::ReZ_1+P::1P+0p LOOPREAC::ImZ_1-P::1P+0p

constrain LOOPREAC::ReZ_1-P::1P-1n LOOPREAC::ImZ_1+P::1P-1n
constrain LOOPREAC::ReZ_1+P::1P-1p LOOPREAC::ImZ_1-P::1P-1p

# P-Waves: constrain datasets
constrain KsPipLamb_00::ReZ_1-P::1P+1n LOOPREAC::ReZ_1-P::1P+1n
constrain KsPipLamb_00::ImZ_1+P::1P+1n LOOPREAC::ImZ_1+P::1P+1n
constrain KsPipLamb_00::ReZ_1+P::1P+1p LOOPREAC::ReZ_1+P::1P+1p
constrain KsPipLamb_00::ImZ_1-P::1P+1p LOOPREAC::ImZ_1-P::1P+1p

constrain KsPipLamb_00::ReZ_1-P::1P+0n LOOPREAC::ReZ_1-P::1P+0n
constrain KsPipLamb_00::ImZ_1+P::1P+0n LOOPREAC::ImZ_1+P::1P+0n
constrain KsPipLamb_00::ReZ_1+P::1P+0p LOOPREAC::ReZ_1+P::1P+0p
constrain KsPipLamb_00::ImZ_1-P::1P+0p LOOPREAC::ImZ_1-P::1P+0p

constrain KsPipLamb_00::ReZ_1-P::1P-1n LOOPREAC::ReZ_1-P::1P-1n
constrain KsPipLamb_00::ImZ_1+P::1P-1n LOOPREAC::ImZ_1+P::1P-1n
constrain KsPipLamb_00::ReZ_1+P::1P-1p LOOPREAC::ReZ_1+P::1P-1p
constrain KsPipLamb_00::ImZ_1-P::1P-1p LOOPREAC::ImZ_1-P::1P-1p

# P-Waves: scale data sets
scale LOOPREAC::ReZ_1-P::1P+1n LOOPSCALE
scale LOOPREAC::ImZ_1+P::1P+1n LOOPSCALE
scale LOOPREAC::ReZ_1+P::1P+1p LOOPSCALE
scale LOOPREAC::ImZ_1-P::1P+1p LOOPSCALE

scale LOOPREAC::ReZ_1-P::1P+0n LOOPSCALE
scale LOOPREAC::ImZ_1+P::1P+0n LOOPSCALE
scale LOOPREAC::ReZ_1+P::1P+0p LOOPSCALE
scale LOOPREAC::ImZ_1-P::1P+0p LOOPSCALE

scale LOOPREAC::ReZ_1-P::1P-1n LOOPSCALE
scale LOOPREAC::ImZ_1+P::1P-1n LOOPSCALE
scale LOOPREAC::ReZ_1+P::1P-1p LOOPSCALE
scale LOOPREAC::ImZ_1-P::1P-1p LOOPSCALE

initialize LOOPREAC::ReZ_1-P::1P+1n cartesian 1.0 0.0 real
initialize LOOPREAC::ReZ_1+P::1P+1p cartesian 1.0 0.0 real

initialize LOOPREAC::ReZ_1-P::1P+0n cartesian 1.0 0.0
initialize LOOPREAC::ReZ_1+P::1P+0p cartesian 1.0 0.0

initialize LOOPREAC::ReZ_1-P::1P-1n cartesian 1.0 0.0
initialize LOOPREAC::ReZ_1+P::1P-1p cartesian 1.0 0.0