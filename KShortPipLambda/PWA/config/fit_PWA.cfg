# Initial values from Farah's Delta SDMEs fit
parameter parScale00_s18fa18 1.00000 fixed
parameter parScale135_s18fa18 0.98276
parameter parScale45_s18fa18 0.98519
parameter parScale90_s18fa18 0.97455


# SDME FIT FUNCTION PARAMETERS
define polVal_00 0.3519
define polVal_45 0.3374
define polVal_90 0.3303
define polVal_135 0.3375

define polAngle_00  0.0
define polAngle_45  45.0
define polAngle_90  90.0
define polAngle_135 135.0

define Kstar 0.892 0.050

# BACKGROUND FIT FUNCTION PARAMETERS
# define bern_xmin 0.6
